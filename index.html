<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Management Game · Insurance Management</title>
<meta name="description" content="Classroom version of the Personal Lines Risk Management and Insurance Simulation Game (Kerr and Avila, 2013): team decisions, d20 rolls and automatic net-worth results.">
<style>
:root{--bg:#f5f4ef;--paper:#fff;--ink:#203a33;--muted:#64756e;--green:#195847;--green-soft:#e6eee9;--line:#d7dfd8;--amber:#c9853b;--amber-soft:#f7ecdd;--mint:#8eb6a1;--error:#9f402e;--error-soft:#f6e4df;--shadow:0 12px 40px #233c3310;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--green);text-underline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c9853baa;outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-.01em;margin-bottom:14px}
h2{font-size:24px;line-height:1.25;margin-bottom:6px}
h3{font-size:17px;margin-bottom:8px}

.site-header{max-width:1400px;margin:auto;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.02em}
.brand-mark{background:var(--green);color:#fff;border-radius:10px;padding:10px;font:600 18px/1 system-ui}
.brand-sub{display:block;font-size:17px;letter-spacing:0}
.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600;min-height:44px;transition:background .15s}
.button:hover:not(:disabled){background:var(--green-soft)}
.button.primary{background:var(--green);border-color:var(--green);color:#fff}
.button.primary:hover:not(:disabled){background:#134637}
.button:disabled{opacity:.45}
.button.quiet{background:transparent}
.link{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:4px;font-size:14px}

.step-nav{max-width:1400px;margin:0 auto 26px;padding:0 5%;display:flex;gap:6px;overflow-x:auto}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:550;color:var(--muted)}
.step span{color:var(--mint);font-weight:700;margin-right:5px}
.step.done{color:var(--ink)}
.step.active{background:var(--green);border-color:var(--green);color:#fff}
.step.active span{color:#cfe2d8}

main{max-width:1400px;margin:auto;padding:0 5% 40px}
.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.lead{font-size:20px;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:0;color:var(--muted);max-width:70ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin:22px 0}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.actions .note{color:var(--muted);font-size:15px}
.actions .warn{color:var(--error);font-size:15px;font-weight:600}

.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px;font-weight:500;color:var(--ink);background:#fff;min-height:44px}
.count-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper .button{min-width:44px;padding:8px 0;font-size:20px;line-height:1}
.stepper input{width:76px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 6px;font-size:18px;font-weight:650;min-height:44px}
.small{font-size:14px}
.team-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.facts{margin:0;display:grid;gap:10px}
.facts div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0;padding-bottom:0}
.facts dt{font-weight:650}
.facts dd{margin:0;color:var(--ink)}
details.card summary{font-weight:700;font-size:18px;cursor:pointer}
details.card ul{margin:14px 0 0;padding-left:20px}
details.card li{margin-bottom:6px}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:18px}
.opt-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.opt-card h3{display:flex;gap:8px;align-items:baseline}
.tag{background:var(--green-soft);color:var(--green);border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700}
.opt-card ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:15px}
.opt-card li{display:grid;grid-template-columns:24px 1fr auto;gap:4px 6px}
.opt-card .key{font-weight:700;color:var(--green)}
.opt-card .cost{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.opt-card .detail{grid-column:2/4;color:var(--muted);font-size:13px;line-height:1.35;margin-top:-2px}

.table-wrap{overflow:auto;max-height:72vh;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:13px;letter-spacing:.03em;color:var(--muted);font-weight:700;background:#fafaf7;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody th{font-weight:700;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.strong{font-weight:750}
.over{color:var(--error);font-weight:700}
.zero{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;min-width:44px;min-height:40px;font-weight:700;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--green-soft)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.seg.missing{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}

.dice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
.scen{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.scen.loss{border-color:var(--error);box-shadow:0 0 0 2px var(--error-soft)}
.scen.safe{border-color:var(--mint)}
.scen .range{font-size:14px;color:var(--muted)}
.scen .range b{color:var(--ink)}
.die-wrap{display:flex;align-items:center;gap:16px;margin:4px 0}
.die{position:relative;width:96px;height:96px;flex:0 0 auto}
.die svg{position:absolute;inset:0}
.die span{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.scen.loss .die polygon{fill:var(--error-soft);stroke:var(--error)}
.scen.safe .die polygon{fill:var(--green-soft);stroke:var(--green)}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:750;font-size:15px}
.chip.loss{background:var(--error);color:#fff}
.chip.safe{background:var(--green-soft);color:var(--green)}
.chip.partial{background:var(--amber-soft);color:#7a4c17}
.manual{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.manual input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
.manual button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;min-height:38px;font-size:14px;font-weight:600}
.who{font-size:14px;color:var(--ink)}

.amt{background:none;border:0;padding:3px 6px;margin:-3px -6px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600;text-decoration:underline dotted;text-underline-offset:4px}
.amt:hover,.amt.sel{background:var(--amber-soft)}
.amt.zero{font-weight:500;text-decoration:none}
.colhead{display:flex;flex-direction:column;gap:3px}
.colhead .chip{font-size:12px;padding:2px 8px;align-self:flex-end}
.explain{margin-top:16px}
.explain ol{margin:8px 0 0;padding-left:22px}
.explain li{margin-bottom:4px}
.explain .empty{color:var(--muted);margin:0}

.board{display:grid;gap:10px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:110px 1fr 120px;gap:12px;align-items:center;font-size:15px}
.bar-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:26px}
.bar .fill{display:flex;height:100%;background:#f1f3ef;border-radius:6px;overflow:hidden}
.bar .p{background:var(--green)}
.bar .r{background:var(--amber)}
.bar .e{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 1.5px #fff}
.bar-row .exp{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bar-row.bench .bench-label{font-weight:750;font-style:italic;color:var(--green)}
.bench-row{background:var(--green-soft)}
.bench-row th{font-style:italic;color:var(--green)}
.bench-row th .small{display:block;font-style:normal;font-weight:500;font-size:12px}
.rank.bench{background:#fff;color:var(--amber);border:1px solid var(--line)}
.rank-toggle{display:flex;align-items:center;gap:10px}
.seg.wide button{padding:0 14px;font-size:14px}
.summary{margin:0 0 12px;font-size:16px}
.table-note{color:var(--muted);font-size:14px;margin:10px 2px 0;max-width:110ch}
.key-row{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}
.key-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:800}
.rank.first{background:var(--green);color:#fff}
.pos{color:var(--green);font-weight:650}
.neg{color:var(--error);font-weight:650}
.pkg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.pkg li{background:var(--green-soft);border-radius:8px;padding:5px 10px;font-size:15px}
.best{background:var(--green-soft)}

footer{max-width:1400px;margin:auto;padding:10px 5% 40px;color:var(--muted);font-size:13px}

@media (max-width:640px){
  body{font-size:16px}
  .site-header,.step-nav,main,footer{padding-left:16px;padding-right:16px}
  .facts div{grid-template-columns:1fr;gap:2px}
  .bar-row{grid-template-columns:70px 1fr 90px}
  th,td{padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.step-nav,.site-header .button,.actions{display:none}.card,.table-wrap,.scen{box-shadow:none}}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#" data-home aria-label="Risk Management Game, setup"><span class="brand-mark">IM</span><span>Insurance Management<span class="brand-sub">Risk Management Game</span></span></a>
  <button class="button quiet" id="new-game">New game</button>
</header>
<nav class="step-nav" id="steps" aria-label="Game steps"></nav>
<main id="app" aria-live="polite"></main>
<footer>
  Adapted from Kerr, D. A. and Avila, S. M. (2013), Personal lines risk management and insurance simulation game, <i>Risk Management and Insurance Review</i> 16(1), 123–146.
  All calculations run in this browser; the game is saved in this browser only.
</footer>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
